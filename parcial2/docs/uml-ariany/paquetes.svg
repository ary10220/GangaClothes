6A50">backend/app/modules/*/service.py</text><rect x="360.0" y="64" width="80" height="16" fill="url(#gPkgHdr)" stroke="#B08A4E" stroke-width="1.1"/><rect x="360.0" y="80" width="260" height="84" fill="url(#gPkgBody)" stroke="#B08A4E" stroke-width="1.1"/><text x="490.0" y="100.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3F2F14">P6. Persistencia</text><text x="490.0" y="117.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5A4A2A">Modelos SQLAlchemy, TenantMixin · listener</text><text x="490.0" y="130.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5A4A2A">multitenant</text><text x="490.0" y="145.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-style="italic" fill="#7A6A50">backend/app/models/ · PostgreSQL</text><rect x="670.0" y="64" width="80" height="16" fill="url(#gPkgHdr)" stroke="#B08A4E" stroke-width="1.1"/><rect x="670.0" y="80" width="260" height="84" fill="url(#gPkgBody)" stroke="#B08A4E" stroke-width="1.1"/><text x="800.0" y="100.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3F2F14">P7. Integraciones</text><text x="800.0" y="117.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5A4A2A">Servicio de IA · voz, Pasarela de pagos,</text><text x="800.0" y="130.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5A4A2A">Modelos ML</text><text x="800.0" y="145.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-style="italic" fill="#7A6A50">backend/app/integrations/</text></svg>